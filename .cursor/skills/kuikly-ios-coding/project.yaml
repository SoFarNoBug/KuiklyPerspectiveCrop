    title: Swift语言
    layer: L1
    ref: ../../../docs/skill-references/coding-norms/base/lang_swift.md
  - id: lang_objc
    title: Objective-C语言
    layer: L1
    ref: ../../../docs/skill-references/coding-norms/base/lang_objc.md
  - id: platform_ios
    title: iOS平台
    layer: L2
    ref: ../../../docs/skill-references/coding-norms/base/platform_ios.md
  - id: lang_kotlin
    title: Kotlin语言
    layer: L1
    ref: ../../../docs/skill-references/coding-norms/base/lang_kotlin.md
  - id: platform_kuikly_compose
    title: KuiklyCompose平台
    layer: L2
    ref: ../../../docs/skill-references/coding-norms/base/platform_kuikly_compose.md
  - id: new_code_file_guidelines
    title: 新建代码文件准则
    layer: L3
    ref: ../../../docs/skill-references/kuikly-ios-coding/project/new_code_file_guidelines.md
  - id: perspective_crop_api
