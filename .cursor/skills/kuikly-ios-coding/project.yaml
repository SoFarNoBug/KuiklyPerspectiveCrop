# 项目配置（受限子集；挂载契约见 docs/skill-references/SCHEMA.md）
project_id: kuikly-perspective-crop
role_rule: .cursor/rules/kuikly-dev-ios.mdc
docs:
  workflow_readme: docs/specs/kuikly-dev-ios/README.md
  skill_changelog: docs/specs/kuikly-dev-ios/changelog.md
  feature_changelog: docs/specs/<name>/changelog.md
  tasks_optional: docs/specs/<name>/tasks.md
  file_map: docs/context/file-map.md
  context_glob: docs/context/*
  reviews_dir: docs/reviews/
  device_check_list_dir: docs/reviews/device-check-list/
review_skill: kuikly-code-review
version_counts: norms
gate_on: meta_only
sediment: on
content_root: ../../../docs/skill-references/kuikly-ios-coding
mounts:
